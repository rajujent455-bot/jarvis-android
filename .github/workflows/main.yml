name: Build JARVIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'        # 3.10 bhi chalta, 3.11 better hai

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache \
            libltdl-dev

          # libtinfo5 NAHI hai 22.04 pe — ye line hata di

      - name: Setup Android SDK         # YE MISSING THA
        uses: android-actions/setup-android@v3

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.37
          pip install python-for-android==2024.01.21   # old version ki jagah

      - name: Cache buildozer global    # YE MISSING THA
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('jarvis/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK
        working-directory: jarvis
        run: |
          buildozer android debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: jarvis/bin/*.apk
          retention-days: 30

      - name: Upload log if failed      # DEBUG ke liye useful
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: jarvis/build.log
