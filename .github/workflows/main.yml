name: Build JARVIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: jarvis/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('jarvis/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK using official Kivy Docker image
        run: |
          docker run --rm \
            --volume ${{ github.workspace }}/jarvis:/home/user/hostcwd \
            kivy/buildozer \
            android debug

      - name: Find APK
        run: |
          find ${{ github.workspace }}/jarvis -name "*.apk" 2>/dev/null || echo "NO APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: jarvis/bin/*.apk
          if-no-files-found: warn
          retention-days: 30
